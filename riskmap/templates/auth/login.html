{% extends "base.html" %}
{% block contenido %}
<section class="login-hero">
  <div class="card login-card">
    <img class="login-logo" src="{{ url_for('static', filename='images/logo-universidad.png') }}" alt="Universidad Simón Bolívar">
    <div class="pill-wrap">
      <span class="eyebrow">• MAPA DE RIESGO ACADÉMICO</span>
    </div>
    <h1>Iniciar sesión</h1>
    <p class="muted">Ingresa con tus credenciales institucionales para acceder al sistema.</p>
    <form method="post">
      <label for="correo">Correo institucional</label>
      <input id="correo" name="correo" type="email" placeholder="usuario@unisimon.edu.co" autocomplete="username" required>
      <label for="clave">Contraseña</label>
      <input id="clave" name="clave" type="password" placeholder="••••••••" autocomplete="current-password" required>
      <button type="submit">Ingresar a la plataforma →</button>
    </form>
  </div>
</section>
{% endblock %}
